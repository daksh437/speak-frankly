<!doctype html>
<html><head><meta charset="utf-8"><style>
  /* Play feature graphic — exactly 1024x500.
   *
   * BRAND SOURCE OF TRUTH: the gradient stops and the mark are taken from the
   * app's own launcher icon (app/assets/icon_512.png), sampled pixel-for-pixel:
   * #7A67FF top-left → #5B4BD6 bottom-right, mark in pure white. The mark file
   * itself is the app's own white_head.png, reused rather than redrawn — this
   * graphic must read as the same product as the store icon sitting next to it.
   *
   * Play crops this differently across surfaces, so everything that carries
   * meaning stays inside a 64px safe margin. */
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }

  .fg { width: 1024px; height: 500px; position: relative; overflow: hidden;
        background: linear-gradient(135deg, #7A67FF 0%, #6B59EB 50%, #5B4BD6 100%);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

  /* Very low-contrast depth only. An app-store graphic competes at thumbnail
     size, so anything busier than this turns to noise. */
  .orb  { position: absolute; border-radius: 50%; background: #fff; opacity: .06; }
  .orb1 { width: 340px; height: 340px; right: -70px;  top: -130px; }
  .orb2 { width: 240px; height: 240px; right: 210px;  bottom: -140px; opacity: .045; }

  .row { position: absolute; inset: 0; display: flex; align-items: center;
         padding: 0 64px; gap: 54px; }

  .copy { flex: 1 1 auto; max-width: 600px; }

  .brand { display: flex; align-items: center; gap: 15px; margin-bottom: 26px; }
  /* Same circular purple avatar treatment the app uses in its home header. */
  .avatar { width: 62px; height: 62px; border-radius: 50%; flex: 0 0 auto;
            background: rgba(255,255,255,.18); display: grid; place-items: center; }
  .avatar img { width: 44px; height: 44px; display: block; }
  .brand-name { color: #fff; font-size: 29px; font-weight: 700; letter-spacing: .2px; }

  h1 { margin: 0; color: #fff; font-size: 58px; line-height: 1.08;
       font-weight: 800; letter-spacing: -1.3px; }
  h1 span { color: #FFD98A; }

  .sub { margin: 20px 0 0; color: #E7E2FF; font-size: 22px; line-height: 1.4;
         font-weight: 400; max-width: 520px; }

  /* Feature names lifted verbatim from the app's own home screen, so the
     graphic promises nothing the build does not ship. */
  .pills { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
  .pill { color: #fff; font-size: 15.5px; font-weight: 600; padding: 9px 17px;
          border-radius: 999px; background: rgba(255,255,255,.17); white-space: nowrap; }

  .markwrap { flex: 0 0 auto; width: 250px; display: grid; place-items: center; }
  .markwrap img { width: 250px; height: 250px; opacity: .95;
                  filter: drop-shadow(0 18px 40px rgba(30,18,90,.35)); }
</style></head>
<body>
  <div class="fg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div class="row">
      <div class="copy">
        <div class="brand">
          <span class="avatar"><img src="white_head.png" alt=""></span>
          <span class="brand-name">Speak Frankly</span>
        </div>
        <h1>Speak English<br>with <span>confidence</span></h1>
        <p class="sub">Practise by talking to an AI tutor that answers what you meant — then fixes it kindly.</p>
        <div class="pills">
          <span class="pill">AI conversations</span>
          <span class="pill">Shadowing practice</span>
          <span class="pill">Story mode</span>
        </div>
      </div>

      <div class="markwrap"><img src="white_head.png" alt=""></div>
    </div>
  </div>
</body></html>
