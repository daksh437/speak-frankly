# Render blueprint for the Speak Frankly backend (a NEW service — not InstaFlow's).
# In Render: New → Blueprint → point at this repo. Set the secret env vars in the
# dashboard (they're marked sync:false so they are NOT committed).
# This is a monorepo (backend + app); Render only builds the `backend` folder.
services:
  - type: web
    name: speak-frankly-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: DAILY_MESSAGES_FREE
        value: "8"
      # ONE FREE DAY, THEN PAYWALL. A new account gets TRIAL_DAYS days of
      # unlimited AI (the "trial" plan — no card, no payment), so the learner
      # feels a real day of the tutor before being asked to pay. When it ends
      # they drop to the free plan, and REQUIRE_PREMIUM then refuses every AI
      # call — the hard paywall. The paid offer they meet there lives in Play
      # (₹5 for 3 days, then ₹199/month), which arrives here as real premium via
      # purchase verification.
      #
      # TRIAL_DAYS is a dial, not a build: try 1, 3, 7 and keep whatever
      # converts. To go fully freemium instead: TRIAL_DAYS=3 and
      # REQUIRE_PREMIUM=false.
      - key: TRIAL_DAYS
        value: "1"
      - key: REQUIRE_PREMIUM
        value: "true"
      # THE FIRST CONVERSATION, FREE. With the paywall above, a new account
      # meets it the moment onboarding ends, having never spoken to the tutor -
      # and nobody pays for something they have not felt. Set this to "true" to
      # give every new account one complete conversation (report included)
      # before the paywall. A LIFETIME allowance, not a daily one: once spent,
      # the paywall behaves exactly as it does now.
      #
      # OFF here on purpose. Turning it on is a pricing decision, so it should
      # be made deliberately rather than arrive with a deploy. No new build is
      # needed either way - /access reports it and the installed app obeys.
      - key: FREE_FIRST_SESSION
        value: "false"
      # How many messages that conversation is worth. A scenario runs 6-10 turns
      # before it has gone anywhere, so fewer than ~8 is a teaser, not a demo.
      - key: FREE_FIRST_SESSION_MESSAGES
        value: "10"

      # APP-REVIEW ACCOUNTS — set this before every Play submission.
      # Play rejects a build whose reviewer meets the paywall, and with the
      # settings above a new account meets it immediately. Any address listed
      # here is kept on premium server-side, which opens every gate at once, so
      # a rejected submission is fixed with an env var and a redeploy rather
      # than a new build. Use the SAME address as Play Console -> App content ->
      # Sign in details, and keep the two in step.
      - key: REVIEWER_EMAILS
        sync: false
      # WHO the paywall applies to. Accounts created on or after this date
      # meet it; everyone already using the app keeps the free tier they
      # signed up for. Set this to the moment you flip REQUIRE_PREMIUM on.
      # LEAVING IT BLANK PAYWALLS EVERY EXISTING USER.
      - key: PAYWALL_FROM
        sync: false
      - key: TRIAL_DAILY_CAP
        value: "50"
      # Daily budget for the "aux" AI helpers (translate, speaking phrases,
      # picture match, vocab extraction, custom scenario) — separate from chat
      # messages so they never eat a learner's 8, and never run unbounded.
      - key: DAILY_AUX_FREE
        value: "30"
      - key: DAILY_AUX_TRIAL
        value: "80"
      # Rewarded ads: bonus messages per ad, and how many ads/day count.
      - key: REWARD_MESSAGES
        value: "5"
      - key: MAX_AD_REWARDS_PER_DAY
        value: "3"
      # Reject any request that doesn't carry a verified Firebase ID token.
      # Keep this FALSE until /health shows auth.legacyHeader ≈ 0 (older app
      # builds only send x-user-uid and would break mid-session) — then flip it
      # to "true" here, because until it is on, ANY caller can claim ANY uid.
      - key: REQUIRE_AUTH_TOKEN
        value: "false"
      # Fair-use ceiling on the "unlimited" premium plan, in messages/day.
      # 0 = genuinely unlimited (today's behaviour). Nothing else in the code
      # bounds a premium account, so one subscription authorises unbounded AI
      # spend. 500 is the suggested value — a heavy learner does 30–50/day, so
      # no real subscriber ever reaches it. Premium is still reported as
      # unlimited to the app; this only bites in the server-side claim.
      - key: PREMIUM_DAILY_CAP
        value: "500"
      # Enables Google Play purchase verification. Requires Play Console →
      # Setup → API access: link this GCP project + grant the service account
      # financial/orders permission.
      - key: PLAY_PACKAGE_NAME
        value: com.speakfrankly
      # Reject a purchase when the Play API can't be reached at all, instead of
      # granting the 3-day grace window. Grace is now limited to accounts that
      # have had a verified purchase before (see premiumController), so leaving
      # this false no longer hands strangers free premium — but turning it on
      # once Play API access is confirmed working removes the grace path
      # entirely, at the cost of blocking real buyers during a Google outage.
      - key: PLAY_VERIFY_STRICT
        value: "false"
