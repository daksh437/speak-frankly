# Render blueprint for the Speak Frankly backend (a NEW service — not InstaFlow's).
# In Render: New → Blueprint → point at this repo. Set the secret env vars in the
# dashboard (they're marked sync:false so they are NOT committed).
# This is a monorepo (backend + app); Render only builds the `backend` folder.
services:
  - type: web
    name: speak-frankly-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: DAILY_MESSAGES_FREE
        value: "8"
      # HARD PAYWALL. Nobody gets AI without a paid subscription: TRIAL_DAYS=0
      # means a new account never resolves to the "trial" plan, and
      # REQUIRE_PREMIUM then refuses every AI call from a free one. The trial
      # learners DO get is the paid one in Play (₹4 for 3 days, then ₹200/month),
      # which arrives here as real premium via purchase verification.
      #
      # To go back to freemium: TRIAL_DAYS=3 and REQUIRE_PREMIUM=false.
      - key: TRIAL_DAYS
        value: "0"
      - key: REQUIRE_PREMIUM
        value: "true"
      - key: TRIAL_DAILY_CAP
        value: "50"
      # Daily budget for the "aux" AI helpers (translate, speaking phrases,
      # picture match, vocab extraction, custom scenario) — separate from chat
      # messages so they never eat a learner's 8, and never run unbounded.
      - key: DAILY_AUX_FREE
        value: "30"
      - key: DAILY_AUX_TRIAL
        value: "80"
      # Rewarded ads: bonus messages per ad, and how many ads/day count.
      - key: REWARD_MESSAGES
        value: "5"
      - key: MAX_AD_REWARDS_PER_DAY
        value: "3"
      # Reject any request that doesn't carry a verified Firebase ID token.
      # Keep this FALSE until /health shows auth.legacyHeader ≈ 0 (older app
      # builds only send x-user-uid and would break mid-session) — then flip it
      # to "true" here, because until it is on, ANY caller can claim ANY uid.
      - key: REQUIRE_AUTH_TOKEN
        value: "false"
      # Fair-use ceiling on the "unlimited" premium plan, in messages/day.
      # 0 = genuinely unlimited (today's behaviour). Nothing else in the code
      # bounds a premium account, so one subscription authorises unbounded AI
      # spend. 500 is the suggested value — a heavy learner does 30–50/day, so
      # no real subscriber ever reaches it. Premium is still reported as
      # unlimited to the app; this only bites in the server-side claim.
      - key: PREMIUM_DAILY_CAP
        value: "0"
      # Enables Google Play purchase verification. Requires Play Console →
      # Setup → API access: link this GCP project + grant the service account
      # financial/orders permission.
      - key: PLAY_PACKAGE_NAME
        value: com.speakfrankly
      # ---- Web checkout (Razorpay) --------------------------------------
      # Sells Premium on OUR OWN site at /checkout, where Play's 15% does not
      # apply — Razorpay's ~2.36% does. The Android app must never link here
      # (Play's anti-steering rule); Play Billing stays the only in-app path.
      # Leave all of these unset and /checkout simply says it isn't available.
      #
      # Razorpay Dashboard → Settings → API Keys.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Settings → Webhooks: point at https://<host>/checkout/webhook and
      # subscribe to subscription.charged / .cancelled / .halted / .completed.
      # WITHOUT this secret no purchase can ever be granted — the webhook is the
      # only thing that grants premium, and an unsigned one is refused.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Subscriptions → Plans: create a monthly and an annual plan, paste the
      # plan_id of each. A plan with no id set is not offered on the page.
      - key: RAZORPAY_PLAN_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_ANNUAL
        sync: false
      # Display labels only (e.g. "₹199"). The amount actually charged is
      # whatever the Razorpay plan says; blank shows a dash rather than a guess.
      - key: RAZORPAY_PRICE_MONTHLY
        sync: false
      - key: RAZORPAY_PRICE_ANNUAL
        sync: false
      # Firebase WEB app config, for Google sign-in on the checkout page. This
      # is a separate app registration from the Android one — Firebase console →
      # Project settings → Your apps → Web. Safe to expose (they are public
      # client keys); the ID token they produce is verified server-side.
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_WEB_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
      # Reject a purchase when the Play API can't be reached at all, instead of
      # granting the 3-day grace window. Grace is now limited to accounts that
      # have had a verified purchase before (see premiumController), so leaving
      # this false no longer hands strangers free premium — but turning it on
      # once Play API access is confirmed working removes the grace path
      # entirely, at the cost of blocking real buyers during a Google outage.
      - key: PLAY_VERIFY_STRICT
        value: "false"
